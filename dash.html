<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PulseLink - Admin</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
        }

        header {
            background: #212121;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            padding: 40px;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #b71c1c;
            margin-bottom: 10px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        .actions {
            margin-top: 30px;
        }

        .actions button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: #b71c1c;
            color: white;
            cursor: pointer;
        }

    </style>

</head>

<body>

<header>

    <h2>🩸 PulseLink Admin</h2>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</header>

<div class="container">

    <h1>Admin Dashboard</h1>

    <p>Blood Banking System Management</p>

    <div class="cards">

        <div class="card">
            <h2>🩸 Blood Units</h2>
            <div class="number">0</div>
            <p>Available Units</p>
        </div>

        <div class="card">
            <h2>👥 Donors</h2>
            <div class="number">0</div>
            <p>Registered Donors</p>
        </div>

        <div class="card">
            <h2>🏥 Hospitals</h2>
            <div class="number">0</div>
            <p>Registered Hospitals</p>
        </div>

        <div class="card">
            <h2>🚨 Requests</h2>
            <div class="number">0</div>
            <p>Emergency Requests</p>
        </div>

    </div>

    <div class="actions">

        <button>Manage Blood Inventory</button>

        <button>Manage Donors</button>

        <button>Manage Hospitals</button>

        <button>View Emergency Requests</button>

        <button>Generate Reports</button>

    </div>

</div>

<script>

function logout() {
    window.location.href = "index.html";
}

</script>

</body>

</html>
