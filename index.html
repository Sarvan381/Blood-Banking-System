<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseLink - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            color: #c41e24;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #c41e24;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #a8171c;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #c41e24;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            color: red;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">🩸 PulseLink</div>
    <div class="subtitle">Blood Banking System</div>

    <div id="message"></div>

    <form onsubmit="login(event)">

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <label>Login As</label>
        <select id="role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
        </select>

        <button type="submit">Login</button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>

<script>
function login(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    // Admin login
    if (
        role === "admin" &&
        email === "admin@pulselink.com" &&
        password === "admin123"
    ) {
        window.location.href = "admin.html";
        return;
    }

    // User login
    const user = JSON.parse(localStorage.getItem("user"));

    if (
        role === "user" &&
        user &&
        email === user.email &&
        password === user.password
    ) {
        window.location.href = "user.html";
        return;
    }

    document.getElementById("message").innerText =
        "Invalid email, password or role.";
}
</script>

</body>
</html>
